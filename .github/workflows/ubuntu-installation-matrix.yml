name: Ubuntu installation matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infrastructure/operations/**"
      - "infrastructure/privilege_helper/**"
      - "tests/infrastructure/ubuntu-lab/**"
      - ".github/workflows/ubuntu-installation-matrix.yml"

permissions:
  contents: read

jobs:
  lab:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker
        run: docker version

      - name: Build, install, and test
        run: ./tests/infrastructure/ubuntu-lab/scripts/lab-test.sh "${{ matrix.ubuntu }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-lab-${{ matrix.ubuntu }}
          path: tests/infrastructure/ubuntu-lab/reports/**
          if-no-files-found: warn

      - name: Cleanup lab containers
        if: always()
        run: ./tests/infrastructure/ubuntu-lab/scripts/lab-down.sh "${{ matrix.ubuntu }}"
