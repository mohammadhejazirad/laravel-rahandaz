name: Build and publish release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing candidate tag, for example v1.0.0-rc.1 (stable publication is blocked)"
        required: true
        type: string
      create_draft:
        description: "Sign and create a private draft prerelease after environment approval"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select an immutable candidate version
        id: version
        env:
          CANDIDATE_EVENT: ${{ github.event_name }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 installer/release/candidate.py >> "$GITHUB_OUTPUT"
          if [[ "$CANDIDATE_EVENT" == workflow_dispatch ]]; then
            commit=$(git rev-parse --verify "refs/tags/$CANDIDATE_TAG^{commit}")
            git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          else
            commit="$GITHUB_SHA"
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: candidate
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rahandaz_test
          POSTGRES_USER: rahandaz
          POSTGRES_PASSWORD: replace-local-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rahandaz -d rahandaz_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis-queue:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      redis-cache:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      DB_HOST: 127.0.0.1
      REDIS_QUEUE_HOST: 127.0.0.1
      REDIS_CACHE_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, pdo_pgsql, redis, sodium, xml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build and test the tagged application
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs --no-interaction
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          cp .env.example .env
          php artisan test --compact
          node --experimental-strip-types --test tests/js/datetime.test.ts
          bash installer/tests/run.sh
          python3 installer/tests/release_test.py
          python3 installer/tests/candidate_test.py
          python3 installer/tests/prerequisites_test.py
          python3 installer/tests/security_test.py
          bash infrastructure/operations/tests/run.sh
          composer audit --locked --no-interaction
          npm audit --audit-level=high
      - name: Bundle production dependencies and assets
        run: |
          composer install --no-dev --no-scripts --no-interaction --prefer-dist --classmap-authoritative
          composer check-platform-reqs --no-dev --no-interaction
          staging=$(mktemp -d)
          mkdir -p "$staging/application"
          git archive --format=tar HEAD | tar -x -C "$staging/application"
          cp -a vendor "$staging/application/vendor"
          cp -a public/build "$staging/application/public/build"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          bash installer/release/assemble.sh --from "$staging/application" --version "${RELEASE_TAG#v}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ needs.candidate.outputs.tag }}
          path: dist/rahandaz-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [candidate, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.RAHANDAZ_AUTOMATIC_PRERELEASES == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.create_draft))
    runs-on: ubuntu-24.04
    # Restrict this environment to main. Optional reviewers pause automatic publication.
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      # Use reviewed tooling from main, not executable code from the candidate artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ needs.candidate.outputs.tag }}
          path: unsigned
      - name: Require a license and a separately pinned public key
        run: |
          test -s LICENSE
          test -s installer/trust/rahandaz-release.pub
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          }
          # An authentication/network error must not be treated as proof of absence.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sign bundle and generate pinned installation assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RAHANDAZ_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          release_assets="$RUNNER_TEMP/rahandaz-release-assets"
          umask 077
          test -n "$RELEASE_SIGNING_KEY"
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key_dir/release.key"
          unset RELEASE_SIGNING_KEY
          openssl pkey -in "$key_dir/release.key" -pubout -out "$key_dir/release.pub"
          cmp "$key_dir/release.pub" installer/trust/rahandaz-release.pub
          version="${RELEASE_TAG#v}"
          artifact="unsigned/rahandaz-${version}.tar.gz"
          bash installer/release/sign-manifest.sh --key "$key_dir/release.key" --artifact "$artifact" --version "$version" --output signed
          bash installer/release/prepare-github.sh --repository "$GITHUB_REPOSITORY" --manifest signed/release.manifest --signature signed/release.manifest.sig --public-key installer/trust/rahandaz-release.pub --artifact "signed/rahandaz-${version}.tar.gz" --output "$release_assets"
          openssl dgst -sha256 -sign "$key_dir/release.key" -out "$release_assets/SHA256SUMS.sig" "$release_assets/SHA256SUMS"
          openssl dgst -sha256 -verify installer/trust/rahandaz-release.pub -signature "$release_assets/SHA256SUMS.sig" "$release_assets/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ needs.candidate.outputs.tag }}
          path: ${{ runner.temp }}/rahandaz-release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish a test prerelease (never stable or latest)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_assets="$RUNNER_TEMP/rahandaz-release-assets"
          if [[ "$CANDIDATE_EVENT" != workflow_dispatch ]]; then
            # Create the tag at the tested commit; an existing tag is a conflict, never reused.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null
          fi
          # Keep incomplete uploads private. Retry only this new draft's signed bytes.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "Rahandaz $RELEASE_TAG — test candidate" --notes-file "$release_assets/INSTALL.md"
          uploaded=false
          for attempt in 1 2 3; do
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            if gh release upload "$RELEASE_TAG" "$release_assets"/* --repo "$GITHUB_REPOSITORY" --clobber; then
              uploaded=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          test "$uploaded" = true
          private_assets=$(mktemp -d "$RUNNER_TEMP/rahandaz-draft.XXXXXX")
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$private_assets"
          cmp installer/trust/rahandaz-release.pub "$private_assets/rahandaz-release.pub"
          openssl dgst -sha256 -verify installer/trust/rahandaz-release.pub -signature "$private_assets/SHA256SUMS.sig" "$private_assets/SHA256SUMS"
          (cd "$private_assets" && sha256sum --check SHA256SUMS)
          if [[ "$CANDIDATE_EVENT" == push ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
      - name: Verify published public assets without authentication
        if: github.event_name == 'push' && !github.event.repository.private
        run: |
          set -euo pipefail
          public_assets=$(mktemp -d "$RUNNER_TEMP/rahandaz-public.XXXXXX")
          public_key="$GITHUB_WORKSPACE/installer/trust/rahandaz-release.pub"
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          for name in INSTALL.md install.sh release.manifest release.manifest.sig rahandaz-release.pub SHA256SUMS SHA256SUMS.sig "rahandaz-${version}.tar.gz"; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --silent --show-error \
              --retry 3 --connect-timeout 15 --max-time 180 "$base/$name" --output "$public_assets/$name"
          done
          cmp "$public_key" "$public_assets/rahandaz-release.pub"
          openssl dgst -sha256 -verify "$public_key" -signature "$public_assets/SHA256SUMS.sig" "$public_assets/SHA256SUMS"
          (cd "$public_assets" && sha256sum --check SHA256SUMS)
          bash "$public_assets/install.sh" --verify-only
