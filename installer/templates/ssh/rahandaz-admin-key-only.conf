# rahandaz-managed: admin-ssh-key-only-v1
# Candidate only; not installed by bootstrap yet.
# Validate the complete sshd_config and its effective policy for every affected identity.
# Existing Include/Match precedence must be checked before any live activation.
Match User rahandaz
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/rahandaz/authorized_keys/%u
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
