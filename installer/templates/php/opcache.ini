; rahandaz-managed: panel-opcache-v1
; Loaded only by rahandaz-php-fpm through PHP_INI_SCAN_DIR. Other PHP 8.4 pools keep the distro defaults.
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.jit=0
opcache.jit_buffer_size=0
