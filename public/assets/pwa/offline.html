<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>ارتباط برقرار نیست · راه‌انداز</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--ink:#0f172a;--surface:#fff;--line:#e2e8f0;--accent:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--ink:#e2e8f0;--surface:#111827;--line:#334155;--accent:#a5b4fc}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:2}main{width:100%;max-width:440px;padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}img{width:64px;height:64px}h1{font-size:1.4rem}p{overflow-wrap:anywhere}a{display:inline-block;padding:10px 18px;color:var(--accent);border:1px solid currentColor;border-radius:10px;text-decoration:none}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
</style>
</head>
<body><main><img src="/branding/logo-symbol.svg" alt="راه‌انداز" width="64" height="64"><h1>ارتباط با پنل برقرار نیست</h1><p>اتصال اینترنت یا دسترسی سرور را بررسی کنید و دوباره تلاش کنید. اطلاعات خصوصی پنل به‌صورت آفلاین ذخیره نمی‌شوند و عملیات مدیریتی به ارتباط زنده با سرور نیاز دارند.</p><a href="">تلاش دوباره</a></main></body>
</html>
